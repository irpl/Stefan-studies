<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATC Procedure Quiz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #141a14;
      color: #ddd;
      min-height: 100vh;
    }
    header {
      background: #1a211a;
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid #2a3a2a;
      position: relative;
    }
    header h1 { font-size: 1.8rem; color: #5a9a5a; }
    header p { color: #999; margin-top: 5px; }
    header .nav-link {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #8ab88a;
      text-decoration: none;
      font-size: 0.9rem;
    }
    header .nav-link:hover { color: #a5d6a7; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #1a211a;
      border-bottom: 2px solid #2a3a2a;
    }
    .controls label { font-weight: 600; }
    .controls select, .controls button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: inherit;
    }
    .controls select { background: #2a3a2a; color: #ddd; }
    .controls button {
      background: #3a6b3a;
      color: #fff;
      font-weight: 600;
      transition: background 0.2s;
    }
    .controls button:hover { background: #4a7d4a; }
    .controls button.secondary { background: #2a3a2a; }
    .controls button.secondary:hover { background: #354535; }

    .score-bar {
      text-align: center;
      padding: 15px;
      font-size: 1.1rem;
      font-weight: 700;
      background: #1a211a;
      border-radius: 8px;
      margin: 10px auto;
      max-width: 700px;
    }
    .score-bar .score-num { color: #5a9a5a; }
    .score-bar .score-total { color: #8ab88a; }

    .card-wrapper {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 15px;
      text-align: center;
    }
    .card-progress {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 15px;
    }
    .card {
      background: #1a211a;
      border-radius: 12px;
      padding: 30px 25px;
      margin-bottom: 20px;
      border: 2px solid #2a3a2a;
      text-align: left;
    }
    .card .parent-context {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 12px;
      font-style: italic;
      padding-bottom: 10px;
      border-bottom: 1px dashed #2a3a2a;
    }
    .card .question-text {
      font-size: 1.15rem;
      color: #ddd;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .card .controls-area {
      margin-top: 15px;
    }
    .feedback {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      text-align: center;
    }
    .feedback.right { background: #1a2a1a; color: #6dbb6d; border: 1px solid #4a8a4a; }
    .feedback.wrong { background: #3a1a1a; color: #ff7a6a; border: 1px solid #e74c3c; }
    .feedback .answer-label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 6px;
      font-weight: 400;
    }

    .nav-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }
    .nav-buttons button {
      padding: 10px 24px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .nav-buttons .next { background: #3a6b3a; color: #fff; }
    .nav-buttons .next:hover { background: #4a7d4a; }
    .nav-buttons .skip { background: #2a3a2a; color: #ddd; }
    .nav-buttons .skip:hover { background: #354535; }

    /* T/F buttons */
    .tf-buttons { display: flex; gap: 12px; justify-content: center; }
    .tf-buttons button {
      flex: 1; max-width: 180px; padding: 18px 0;
      font-size: 1.1rem; font-weight: 700;
      border: 2px solid #2a3a2a; border-radius: 10px;
      background: #141a14; color: #ddd; cursor: pointer;
      font-family: inherit; transition: all 0.15s;
    }
    .tf-buttons button:hover:not(:disabled) { background: #1e261e; border-color: #5a9a5a; }
    .tf-buttons button.correct { background: #1a3a1a; border-color: #4a8a4a; color: #6dbb6d; }
    .tf-buttons button.incorrect { background: #3a1a1a; border-color: #e74c3c; color: #ff7a6a; }
    .tf-buttons button:disabled { cursor: default; }

    /* MCQ option buttons */
    .mcq-options { display: flex; flex-direction: column; gap: 10px; }
    .mcq-options button {
      padding: 12px 16px; font-size: 1rem;
      border: 2px solid #2a3a2a; border-radius: 8px;
      background: #141a14; color: #ddd; cursor: pointer;
      font-family: inherit; text-align: left; transition: all 0.15s;
    }
    .mcq-options button:hover:not(:disabled) { background: #1e261e; border-color: #5a9a5a; }
    .mcq-options button.correct { background: #1a3a1a; border-color: #4a8a4a; color: #6dbb6d; }
    .mcq-options button.incorrect { background: #3a1a1a; border-color: #e74c3c; color: #ff7a6a; }
    .mcq-options button:disabled { cursor: default; }

    /* Multi-select checkboxes */
    .ms-options { display: flex; flex-direction: column; gap: 8px; }
    .ms-options label {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: #141a14;
      border: 2px solid #2a3a2a; border-radius: 8px;
      cursor: pointer; transition: all 0.15s;
    }
    .ms-options label:hover { border-color: #5a9a5a; }
    .ms-options label.correct { border-color: #4a8a4a; background: #1a3a1a; }
    .ms-options label.incorrect { border-color: #e74c3c; background: #3a1a1a; }
    .ms-options label.missed { border-color: #c79b3a; background: #2a2614; }
    .ms-options input[type="checkbox"] { width: 18px; height: 18px; accent-color: #5a9a5a; }

    /* Matching rows */
    .match-rows { display: flex; flex-direction: column; gap: 8px; }
    .match-row {
      display: grid; grid-template-columns: 60px 1fr; gap: 12px; align-items: center;
    }
    .match-row .match-label {
      text-align: center; font-weight: 700;
      background: #2a3a2a; padding: 10px; border-radius: 6px; color: #5a9a5a;
    }
    .match-row select {
      padding: 10px; background: #141a14; border: 2px solid #2a3a2a;
      color: #ddd; border-radius: 6px; font-family: inherit; font-size: 0.95rem;
    }
    .match-row select.correct { border-color: #4a8a4a; background: #1a2a1a; }
    .match-row select.incorrect { border-color: #e74c3c; background: #2a1a1a; }

    /* Ordered steps */
    .ordered-area .ordered-slots {
      display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;
      padding: 12px; background: #141a14; border: 2px dashed #2a3a2a;
      border-radius: 8px; min-height: 60px;
    }
    .ordered-area .slot {
      display: flex; align-items: center; gap: 10px;
      padding: 10px; background: #1a211a; border-radius: 6px; border: 1px solid #2a3a2a;
    }
    .ordered-area .slot .slot-num { font-weight: 700; color: #5a9a5a; min-width: 24px; }
    .ordered-area .slot.correct { border-color: #4a8a4a; background: #1a2a1a; }
    .ordered-area .slot.incorrect { border-color: #e74c3c; background: #2a1a1a; }
    .ordered-area .slot.empty { color: #555; font-style: italic; }
    .ordered-area .step-pool { display: flex; flex-direction: column; gap: 8px; }
    .ordered-area .step-pool button {
      padding: 10px 14px; background: #141a14;
      border: 2px solid #2a3a2a; border-radius: 6px; color: #ddd;
      cursor: pointer; font-family: inherit; text-align: left; font-size: 0.95rem;
    }
    .ordered-area .step-pool button:hover:not(:disabled) {
      border-color: #5a9a5a; background: #1e261e;
    }
    .ordered-area .step-pool button:disabled { opacity: 0.35; cursor: default; }

    /* Inline input for multi-fill */
    .inline-input {
      display: inline-block; width: 110px; padding: 4px 8px;
      border: 2px solid #2a3a2a; border-radius: 4px;
      background: #141a14; color: #eee; font-size: 1rem; font-family: inherit;
      margin: 0 4px;
    }
    .inline-input:focus { outline: none; border-color: #5a9a5a; }
    .inline-input.correct { border-color: #4a8a4a; background: #1a2a1a; }
    .inline-input.incorrect { border-color: #e74c3c; background: #3a1a1a; }

    /* Single fill input */
    .fill-input {
      width: 100%; padding: 12px 14px;
      border: 2px solid #2a3a2a; border-radius: 8px;
      background: #141a14; color: #eee; font-size: 1rem; font-family: inherit;
    }
    .fill-input:focus { outline: none; border-color: #5a9a5a; }
    .fill-input.correct { border-color: #4a8a4a; background: #1a2a1a; }
    .fill-input.incorrect { border-color: #e74c3c; background: #3a1a1a; }

    /* Submit button inside cards */
    .submit-btn {
      margin-top: 16px; padding: 10px 24px;
      border-radius: 8px; border: none;
      font-size: 1rem; font-weight: 600;
      cursor: pointer; background: #3a6b3a; color: #fff;
      font-family: inherit;
    }
    .submit-btn:hover:not(:disabled) { background: #4a7d4a; }
    .submit-btn:disabled { opacity: 0.5; cursor: default; }

    @media (max-width: 600px) {
      header h1 { font-size: 1.4rem; }
      header .nav-link { position: static; display: block; margin-bottom: 10px; }
      .card { padding: 20px 15px; }
      .card .question-text { font-size: 1rem; }
    }
  </style>
</head>

<header>

<div class="controls">

</div>

<div id="card-container"></div>

  { id: 40, type: "ordered", q: "Order the AIT procedures on Atlanta RNAV South Departures that will enter LAGRANGE Sector:", steps: ["21 clear A/C FL230","21 H/O to 22","22 accept & enter at AOB FL280","22 H/O to 10","21 climb A/C and transfer comms to 10"] },
  { id: 41, type: "fill", q: "When Bulldog A and B MOA's/ATCAA are used in conjunction, the block altitude limits are ___. (Instructors want the simple version.)", a: "500 ft AGL up to FL270" },
  { id: 42, type: "fill", q: "The altitude limits of Bulldog A MOA are ___.", a: "500 AGL up to but not including 10,000 MSL" },
  { id: 43, type: "fill", q: "The altitude limits when operations are conducted in Bulldog B MOA ONLY are ___.", a: "11,000 - 17,999 MSL" },
  { id: 44, type: "fill", q: "The altitude limits of Bulldog D MOA are ___.", a: "500 AGL to 17,000 MSL" },
  { id: 45, type: "fill", q: "If radio failure occurs after receiving a MOA/ATCAA clearance, the pilot must depart from ___ at the EFC time and proceed to destination at FL230 (or highest altitude of last assigned block if below FL230).", a: "KNINE" },
  /* INSERT_QUESTIONS_HERE */
];

// Engine state — populated in subsequent edits
let deck = [];
let cardIndex = 0;
let correctCount = 0;
let answeredCount = 0;

// --- Helpers ---
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normalize(s) {
  return String(s).trim().toLowerCase()
    .replace(/\s+/g, ' ')
    .replace(/[.,;:!?]+$/, '');
}

function normalizeNumeric(s) {
  return String(s).trim().toLowerCase()
    .replace(/[,\s]/g, '')
    .replace(/(ft|feet|knots?|kts?)$/i, '');
}

function eq(a, b, numeric) {
  if (numeric) return normalizeNumeric(a) === normalizeNumeric(b);
  return normalize(a) === normalize(b);
}

function setEqual(a, b) {
  if (a.length !== b.length) return false;
  const an = a.map(normalize).sort();
  const bn = b.map(normalize).sort();
  return an.every((v, i) => v === bn[i]);
}

// Distractor pools — built from QUESTIONS data on init
let POOLS = {};
function buildPools(questions) {
  const pools = {
    fl: new Set(),
    'altitude-ft': new Set(),
    airport: new Set(),
    sector: new Set()
  };
  for (const q of questions) {
    const all = [];
    if (typeof q.a === 'string') all.push(q.a);
    if (Array.isArray(q.a)) all.push(...q.a.filter(x => typeof x === 'string'));
    if (q.blanks) all.push(...q.blanks);
    if (q.steps) all.push(...q.steps);
    if (q.options) all.push(...q.options);
    for (const v of all) {
      if (typeof v !== 'string') continue;
      const flMatch = v.match(/(?:AOB |At |Cross )?FL\d{2,3}(?:[-\/]FL\d{2,3})?/gi);
      if (flMatch) flMatch.forEach(x => pools.fl.add(x.trim()));
      const altMatch = v.match(/\b\d{1,3},\d{3}(?:\s*(?:ft|feet))?\b/gi);
      if (altMatch) altMatch.forEach(x => pools['altitude-ft'].add(x.trim()));
      const apMatch = v.match(/\bK[A-Z]{3}\b/g);
      if (apMatch) apMatch.forEach(x => pools.airport.add(x));
    }
  }
  return Object.fromEntries(Object.entries(pools).map(([k, v]) => [k, Array.from(v)]));
}

function sampleDistractors(pool, correctAnswer, count) {
  const candidates = (POOLS[pool] || []).filter(x => normalize(x) !== normalize(correctAnswer));
  return shuffle(candidates).slice(0, count);
}

// --- Renderers ---
// Each renderer signature: (q, container, onComplete) => { reveal }
// onComplete(correct, userText, correctText) is called once the user submits.

function renderTF(q, container, onComplete) {
  const wrap = document.createElement('div');
  wrap.className = 'tf-buttons';
  const btnTrue = document.createElement('button');
  btnTrue.textContent = 'TRUE';
  const btnFalse = document.createElement('button');
  btnFalse.textContent = 'FALSE';
  wrap.appendChild(btnTrue);
  wrap.appendChild(btnFalse);
  container.appendChild(wrap);

  let answered = false;
  function pick(value) {
    if (answered) return;
    answered = true;
    const correct = (value === q.a);
    btnTrue.disabled = true;
    btnFalse.disabled = true;
    const chosenBtn = value ? btnTrue : btnFalse;
    const correctBtn = q.a ? btnTrue : btnFalse;
    chosenBtn.classList.add(correct ? 'correct' : 'incorrect');
    if (!correct) correctBtn.classList.add('correct');
    onComplete(correct, value ? 'TRUE' : 'FALSE', q.a ? 'TRUE' : 'FALSE');
  }
  btnTrue.addEventListener('click', () => pick(true));
  btnFalse.addEventListener('click', () => pick(false));

  return {
    reveal: () => {
      if (answered) return;
      answered = true;
      btnTrue.disabled = true;
      btnFalse.disabled = true;
      (q.a ? btnTrue : btnFalse).classList.add('correct');
      onComplete(false, '(revealed)', q.a ? 'TRUE' : 'FALSE');
    }
  };
}

function renderFill(q, container, onComplete) {
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'fill-input';
  input.placeholder = 'Type your answer...';
  input.autocomplete = 'off';
  if (q.numeric) input.inputMode = 'decimal';
  container.appendChild(input);

  const submitBtn = document.createElement('button');
  submitBtn.className = 'submit-btn';
  submitBtn.textContent = 'Submit';
  container.appendChild(submitBtn);

  let answered = false;
  function submit() {
    if (answered) return;
    answered = true;
    const userVal = input.value;
    const correct = eq(userVal, q.a, q.numeric);
    input.disabled = true;
    submitBtn.disabled = true;
    input.classList.add(correct ? 'correct' : 'incorrect');
    onComplete(correct, userVal || '(blank)', q.a);
  }
  submitBtn.addEventListener('click', submit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); submit(); }
  });
  setTimeout(() => input.focus(), 50);

  return {
    reveal: () => {
      if (answered) return;
      answered = true;
      input.value = q.a;
      input.disabled = true;
      submitBtn.disabled = true;
      input.classList.add('correct');
      onComplete(false, '(revealed)', q.a);
    }
  };
}

function renderMultiFill(q, container, onComplete) {
  const para = document.createElement('p');
  para.style.fontSize = '1.1rem';
  para.style.lineHeight = '2.2';
  para.style.color = '#ddd';
  para.style.marginBottom = '8px';
  const parts = q.q.split(/_{2,}/);
  const inputs = [];
  parts.forEach((part, i) => {
    para.appendChild(document.createTextNode(part));
    if (i < q.blanks.length) {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'inline-input';
      input.autocomplete = 'off';
      const ans = q.blanks[i];
      if (/^[\d,.\s]+$/.test(ans)) input.inputMode = 'decimal';
      para.appendChild(input);
      inputs.push(input);
    }
  });
  container.appendChild(para);

  const submitBtn = document.createElement('button');
  submitBtn.className = 'submit-btn';
  submitBtn.textContent = 'Submit';
  container.appendChild(submitBtn);

  let answered = false;
  function submit() {
    if (answered) return;
    answered = true;
    let allCorrect = true;
    const userVals = inputs.map(i => i.value);
    inputs.forEach((input, i) => {
      const isNumeric = /^[\d,.\s]+$/.test(q.blanks[i]);
      const ok = eq(input.value, q.blanks[i], isNumeric);
      input.disabled = true;
      input.classList.add(ok ? 'correct' : 'incorrect');
      if (!ok) allCorrect = false;
    });
    submitBtn.disabled = true;
    onComplete(allCorrect, userVals.map(v => v || '_').join(' / '), q.blanks.join(' / '));
  }
  submitBtn.addEventListener('click', submit);
  inputs.forEach((input, i) => {
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (i < inputs.length - 1) inputs[i + 1].focus();
        else submit();
      }
    });
  });
  setTimeout(() => inputs[0] && inputs[0].focus(), 50);

  return {
    reveal: () => {
      if (answered) return;
      answered = true;
      inputs.forEach((input, i) => {
        input.value = q.blanks[i];
        input.disabled = true;
        input.classList.add('correct');
      });
      submitBtn.disabled = true;
      onComplete(false, '(revealed)', q.blanks.join(' / '));
    }
  };
}

function renderMCQ(q, container, onComplete) {
  const wrap = document.createElement('div');
  wrap.className = 'mcq-options';

  // Build options: explicit q.options wins, else sample from pool
  let opts;
  if (q.options && q.options.length) {
    opts = q.options.slice();
  } else if (q.pool) {
    const distractors = sampleDistractors(q.pool, q.a, 3);
    opts = [q.a, ...distractors];
  } else {
    opts = [q.a];
  }
  // Ensure correct answer is present
  if (!opts.some(o => normalize(o) === normalize(q.a))) {
    opts.unshift(q.a);
  }
  // De-duplicate (keep first occurrence)
  const seen = new Set();
  opts = opts.filter(o => {
    const k = normalize(o);
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  opts = shuffle(opts);

  const buttons = opts.map(opt => {
    const btn = document.createElement('button');
    btn.textContent = opt;
    wrap.appendChild(btn);
    return { btn, value: opt };
  });
  container.appendChild(wrap);

  let answered = false;
  function pick(value, btn) {
    if (answered) return;
    answered = true;
    const correct = normalize(value) === normalize(q.a);
    buttons.forEach(b => { b.btn.disabled = true; });
    btn.classList.add(correct ? 'correct' : 'incorrect');
    if (!correct) {
      const right = buttons.find(b => normalize(b.value) === normalize(q.a));
      if (right) right.btn.classList.add('correct');
    }
    onComplete(correct, value, q.a);
  }
  buttons.forEach(b => b.btn.addEventListener('click', () => pick(b.value, b.btn)));

  return {
    reveal: () => {
      if (answered) return;
      answered = true;
      buttons.forEach(b => { b.btn.disabled = true; });
      const right = buttons.find(b => normalize(b.value) === normalize(q.a));
      if (right) right.btn.classList.add('correct');
      onComplete(false, '(revealed)', q.a);
    }
  };
}

function renderMultiSelect(q, container, onComplete) {
  const wrap = document.createElement('div');
  wrap.className = 'ms-options';

  // Options: explicit q.options or correct answers + sampled distractors
  let opts;
  if (q.options && q.options.length) {
    opts = q.options.slice();
  } else if (q.pool) {
    const wantDistractors = Math.max(3, q.a.length);
    const distractors = sampleDistractors(q.pool, q.a[0], wantDistractors);
    opts = [...q.a, ...distractors];
  } else {
    opts = q.a.slice();
  }
  // Ensure all correct answers are present
  q.a.forEach(ans => {
    if (!opts.some(o => normalize(o) === normalize(ans))) opts.push(ans);
  });
  // De-dup
  const seen = new Set();
  opts = opts.filter(o => {
    const k = normalize(o);
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  opts = shuffle(opts);

  const labels = opts.map(opt => {
    const lbl = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = opt;
    lbl.appendChild(cb);
    const span = document.createElement('span');
    span.textContent = opt;
    lbl.appendChild(span);
    wrap.appendChild(lbl);
    return { lbl, cb, value: opt };
  });
  container.appendChild(wrap);

  const submitBtn = document.createElement('button');
  submitBtn.className = 'submit-btn';
  submitBtn.textContent = 'Submit';
  container.appendChild(submitBtn);

  let answered = false;
  function submit() {
    if (answered) return;
    answered = true;
    const checked = labels.filter(l => l.cb.checked).map(l => l.value);
    const correct = setEqual(checked, q.a);
    submitBtn.disabled = true;
    labels.forEach(l => {
      l.cb.disabled = true;
      const isCorrectAnswer = q.a.some(ans => normalize(ans) === normalize(l.value));
      if (l.cb.checked && isCorrectAnswer) l.lbl.classList.add('correct');
      else if (l.cb.checked && !isCorrectAnswer) l.lbl.classList.add('incorrect');
      else if (!l.cb.checked && isCorrectAnswer) l.lbl.classList.add('missed');
    });
    onComplete(correct, checked.join(', ') || '(none)', q.a.join(', '));
  }
  submitBtn.addEventListener('click', submit);

  return {
    reveal: () => {
      if (answered) return;
      answered = true;
      submitBtn.disabled = true;
      labels.forEach(l => {
        l.cb.disabled = true;
        const isCorrectAnswer = q.a.some(ans => normalize(ans) === normalize(l.value));
        if (isCorrectAnswer) {
          l.cb.checked = true;
          l.lbl.classList.add('correct');
        }
      });
      onComplete(false, '(revealed)', q.a.join(', '));
    }
  };
}

function renderMatching(q, container, onComplete) {
  const wrap = document.createElement('div');
  wrap.className = 'match-rows';

  const allValues = q.pairs.map(p => p[1]);
  const uniqueValues = Array.from(new Set(allValues));
  const optionList = shuffle(uniqueValues.slice());

  const rows = q.pairs.map(([label, correctValue]) => {
    const row = document.createElement('div');
    row.className = 'match-row';
    const labelEl = document.createElement('div');
    labelEl.className = 'match-label';
    labelEl.textContent = label;
    row.appendChild(labelEl);

    const select = document.createElement('select');
    const blank = document.createElement('option');
    blank.value = '';
    blank.textContent = '— pick one —';
    select.appendChild(blank);
    optionList.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      select.appendChild(opt);
    });
    row.appendChild(select);
    wrap.appendChild(row);
    return { row, select, label, correctValue };
  });
  container.appendChild(wrap);

  const submitBtn = document.createElement('button');
  submitBtn.className = 'submit-btn';
  submitBtn.textContent = 'Submit';
  container.appendChild(submitBtn);

  let answered = false;
  function submit() {
    if (answered) return;
    answered = true;
    submitBtn.disabled = true;
    let allCorrect = true;
    rows.forEach(r => {
      r.select.disabled = true;
      const ok = normalize(r.select.value) === normalize(r.correctValue);
      r.select.classList.add(ok ? 'correct' : 'incorrect');
      if (!ok) allCorrect = false;
    });
    const userText = rows.map(r => r.label + ':' + (r.select.value || '_')).join(', ');
    const correctText = rows.map(r => r.label + ':' + r.correctValue).join(', ');
    onComplete(allCorrect, userText, correctText);
  }
  submitBtn.addEventListener('click', submit);

  return {
    reveal: () => {
      if (answered) return;
      answered = true;
      submitBtn.disabled = true;
      rows.forEach(r => {
        r.select.value = r.correctValue;
        r.select.disabled = true;
        r.select.classList.add('correct');
      });
      const correctText = rows.map(r => r.label + ':' + r.correctValue).join(', ');
      onComplete(false, '(revealed)', correctText);
    }
  };
}

function renderOrdered(q, container, onComplete) {
  const wrap = document.createElement('div');
  wrap.className = 'ordered-area';

  const slotsEl = document.createElement('div');
  slotsEl.className = 'ordered-slots';
  wrap.appendChild(slotsEl);

  const poolEl = document.createElement('div');
  poolEl.className = 'step-pool';
  wrap.appendChild(poolEl);
  container.appendChild(wrap);

  const placed = [];
  const shuffledSteps = shuffle(q.steps);
  let answered = false;

  function renderSlots() {
    slotsEl.innerHTML = '';
    for (let i = 0; i < q.steps.length; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot' + (placed[i] ? '' : ' empty');
      const num = document.createElement('span');
      num.className = 'slot-num';
      num.textContent = (i + 1) + '.';
      slot.appendChild(num);
      const text = document.createElement('span');
      text.textContent = placed[i] || '(empty)';
      slot.appendChild(text);
      slotsEl.appendChild(slot);
    }
  }

  function renderPool() {
    poolEl.innerHTML = '';
    shuffledSteps.forEach(step => {
      const btn = document.createElement('button');
      btn.textContent = step;
      btn.disabled = answered || placed.includes(step);
      btn.addEventListener('click', () => {
        if (answered || placed.includes(step)) return;
        placed.push(step);
        renderSlots();
        renderPool();
        if (placed.length === q.steps.length) submit();
      });
      poolEl.appendChild(btn);
    });
  }

  renderSlots();
  renderPool();

  function submit() {
    if (answered) return;
    answered = true;
    let allCorrect = true;
    [...slotsEl.children].forEach((slot, i) => {
      const ok = normalize(placed[i] || '') === normalize(q.steps[i]);
      slot.classList.remove('empty');
      slot.classList.add(ok ? 'correct' : 'incorrect');
      if (!ok) allCorrect = false;
    });
    [...poolEl.children].forEach(btn => { btn.disabled = true; });
    onComplete(allCorrect, placed.join(' → '), q.steps.join(' → '));
  }

  return {
    reveal: () => {
      if (answered) return;
      answered = true;
      placed.length = 0;
      q.steps.forEach(s => placed.push(s));
      renderSlots();
      [...slotsEl.children].forEach(slot => {
        slot.classList.remove('empty');
        slot.classList.add('correct');
      });
      [...poolEl.children].forEach(btn => { btn.disabled = true; });
      onComplete(false, '(revealed)', q.steps.join(' → '));
    }
  };
}

// --- Engine ---
const RENDERERS = {
  'tf': renderTF,
  'fill': renderFill,
  'multi-fill': renderMultiFill,
  'mcq': renderMCQ,
  'multi-select': renderMultiSelect,
  'matching': renderMatching,
  'ordered': renderOrdered
};

let currentReveal = null;

function buildDeck(filter) {
  let pool = QUESTIONS.slice();
  if (filter && filter !== 'all') {
    pool = pool.filter(q => q.type === filter);
  }
  return shuffle(pool);
}

function startQuiz() {
  const filter = document.getElementById('filter-select').value;
  POOLS = buildPools(QUESTIONS);
  deck = buildDeck(filter);
  cardIndex = 0;
  correctCount = 0;
  answeredCount = 0;
  document.getElementById('score-bar').style.display = 'block';
  updateScore();
  if (deck.length === 0) {
    document.getElementById('card-container').innerHTML =
      '<div class="card-wrapper"><div class="card"><div class="question-text" style="text-align:center;">No questions yet — add data in bites 12–16, or pick a different filter.</div></div></div>';
    return;
  }
  showCard();
}

function updateScore() {
  document.getElementById('score-correct').textContent = correctCount;
  document.getElementById('score-total').textContent = deck.length;
}

function showCard() {
  const container = document.getElementById('card-container');
  container.innerHTML = '';
  currentReveal = null;

  if (cardIndex >= deck.length) {
    container.innerHTML =
      '<div class="card-wrapper"><div class="card"><div class="question-text" style="text-align:center;">' +
      'Quiz complete! Final score: ' + correctCount + ' / ' + deck.length +
      '</div></div></div>';
    return;
  }

  const q = deck[cardIndex];
  const wrap = document.createElement('div');
  wrap.className = 'card-wrapper';

  const progress = document.createElement('div');
  progress.className = 'card-progress';
  progress.textContent = (cardIndex + 1) + ' / ' + deck.length + ' — ' + q.type;
  wrap.appendChild(progress);

  const card = document.createElement('div');
  card.className = 'card';

  if (q.parent) {
    const ctx = document.createElement('div');
    ctx.className = 'parent-context';
    ctx.textContent = q.parent;
    card.appendChild(ctx);
  }

  // Multi-fill renders the full sentence inline; skip the standalone q text
  if (q.type !== 'multi-fill') {
    const qText = document.createElement('div');
    qText.className = 'question-text';
    qText.textContent = q.q;
    card.appendChild(qText);
  }

  const ctrls = document.createElement('div');
  ctrls.className = 'controls-area';
  card.appendChild(ctrls);

  const fb = document.createElement('div');
  fb.className = 'feedback';
  fb.style.display = 'none';
  card.appendChild(fb);

  const navWrap = document.createElement('div');
  navWrap.className = 'nav-buttons';
  navWrap.style.display = 'none';
  const nextBtn = document.createElement('button');
  nextBtn.className = 'next';
  nextBtn.textContent = (cardIndex < deck.length - 1) ? 'Next →' : 'Finish';
  nextBtn.addEventListener('click', () => {
    cardIndex++;
    showCard();
  });
  navWrap.appendChild(nextBtn);
  card.appendChild(navWrap);

  function onComplete(correct, userText, correctText) {
    answeredCount++;
    if (correct) correctCount++;
    updateScore();
    fb.style.display = 'block';
    fb.classList.remove('right', 'wrong');
    if (correct) {
      fb.classList.add('right');
      fb.textContent = '✓ Correct!';
    } else {
      fb.classList.add('wrong');
      fb.innerHTML = '✗ ' + (userText === '(revealed)' ? 'Revealed.' : 'Incorrect.') +
        '<span class="answer-label">Answer: ' + correctText + '</span>';
    }
    navWrap.style.display = 'flex';
    nextBtn.focus();
  }

  const renderer = RENDERERS[q.type];
  if (renderer) {
    const handle = renderer(q, ctrls, onComplete);
    currentReveal = handle && handle.reveal;
  } else {
    ctrls.textContent = 'Unknown question type: ' + q.type;
  }

  wrap.appendChild(card);
  container.appendChild(wrap);
  window.scrollTo(0, 0);
}

function revealCurrent() {
  if (currentReveal) currentReveal();
}

document.getElementById('filter-select').addEventListener('change', startQuiz);

// Init on page load
startQuiz();
</script>

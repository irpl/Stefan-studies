<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATC Procedure Quiz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #141a14;
      color: #ddd;
      min-height: 100vh;
    }
    header {
      background: #1a211a;
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid #2a3a2a;
      position: relative;
    }
    header h1 { font-size: 1.8rem; color: #5a9a5a; }
    header p { color: #999; margin-top: 5px; }
    header .nav-link {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #8ab88a;
      text-decoration: none;
      font-size: 0.9rem;
    }
    header .nav-link:hover { color: #a5d6a7; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #1a211a;
      border-bottom: 2px solid #2a3a2a;
    }
    .controls label { font-weight: 600; }
    .controls select, .controls button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: inherit;
    }
    .controls select { background: #2a3a2a; color: #ddd; }
    .controls button {
      background: #3a6b3a;
      color: #fff;
      font-weight: 600;
      transition: background 0.2s;
    }
    .controls button:hover { background: #4a7d4a; }
    .controls button.secondary { background: #2a3a2a; }
    .controls button.secondary:hover { background: #354535; }

    .score-bar {
      text-align: center;
      padding: 15px;
      font-size: 1.1rem;
      font-weight: 700;
      background: #1a211a;
      border-radius: 8px;
      margin: 10px auto;
      max-width: 700px;
    }
    .score-bar .score-num { color: #5a9a5a; }
    .score-bar .score-total { color: #8ab88a; }

    .card-wrapper {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 15px;
      text-align: center;
    }
    .card-progress {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 15px;
    }
    .card {
      background: #1a211a;
      border-radius: 12px;
      padding: 30px 25px;
      margin-bottom: 20px;
      border: 2px solid #2a3a2a;
      text-align: left;
    }
    .card .parent-context {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 12px;
      font-style: italic;
      padding-bottom: 10px;
      border-bottom: 1px dashed #2a3a2a;
    }
    .card .question-text {
      font-size: 1.15rem;
      color: #ddd;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .card .controls-area {
      margin-top: 15px;
    }
    .feedback {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      text-align: center;
    }
    .feedback.right { background: #1a2a1a; color: #6dbb6d; border: 1px solid #4a8a4a; }
    .feedback.wrong { background: #3a1a1a; color: #ff7a6a; border: 1px solid #e74c3c; }
    .feedback .answer-label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 6px;
      font-weight: 400;
    }

    .nav-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }
    .nav-buttons button {
      padding: 10px 24px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .nav-buttons .next { background: #3a6b3a; color: #fff; }
    .nav-buttons .next:hover { background: #4a7d4a; }
    .nav-buttons .skip { background: #2a3a2a; color: #ddd; }
    .nav-buttons .skip:hover { background: #354535; }

    @media (max-width: 600px) {
      header h1 { font-size: 1.4rem; }
      header .nav-link { position: static; display: block; margin-bottom: 10px; }
      .card { padding: 20px 15px; }
      .card .question-text { font-size: 1rem; }
    }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="nav-link">&larr; Sector Frequencies</a>
  <h1>ATC Procedure Quiz</h1>
  <p>Atlanta Center (ZTL) / A80 procedures &mdash; shuffled flashcards</p>
</header>

<div class="controls">
  <label for="filter-select">Filter:</label>
  <select id="filter-select">
    <option value="all">All Types</option>
    <option value="tf">True / False only</option>
    <option value="fill">Fill-in only</option>
    <option value="mcq">Multiple Choice only</option>
    <option value="multi-select">Multi-Select only</option>
    <option value="matching">Matching only</option>
    <option value="ordered">Ordered Steps only</option>
  </select>
  <button onclick="startQuiz()">New Quiz</button>
  <button class="secondary" onclick="revealCurrent()">Reveal</button>
</div>

<div class="score-bar" id="score-bar" style="display:none;">
  Score: <span class="score-num" id="score-correct">0</span> / <span class="score-total" id="score-total">0</span>
</div>

<div id="card-container"></div>

</body>
</html>

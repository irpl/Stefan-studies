<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATC Frequency Quiz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #141a14;
      color: #ddd;
      min-height: 100vh;
    }
    header {
      background: #1a211a;
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid #2a3a2a;
    }
    header h1 { font-size: 1.8rem; color: #5a9a5a; }
    header p { color: #999; margin-top: 5px; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #1a211a;
      border-bottom: 2px solid #2a3a2a;
    }
    .controls label { font-weight: 600; }
    .controls select, .controls button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .controls select {
      background: #2a3a2a;
      color: #ddd;
    }
    .controls button {
      background: #3a6b3a;
      color: #fff;
      font-weight: 600;
      transition: background 0.2s;
    }
    .controls button:hover { background: #4a7d4a; }
    .controls button.secondary {
      background: #2a3a2a;
    }
    .controls button.secondary:hover { background: #354535; }

    .quiz-container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .sheet-title {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      color: #5a9a5a;
      margin: 20px 0 10px;
      padding: 10px;
      background: #1a211a;
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      background: #1a211a;
      border-radius: 8px;
      overflow: hidden;
    }
    th {
      background: #2a3a2a;
      padding: 10px 12px;
      text-align: left;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    td {
      padding: 8px 12px;
      border-bottom: 1px solid #141a14;
      font-size: 0.95rem;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: #1e261e; }

    input.quiz-input {
      width: 100%;
      padding: 6px 8px;
      border: 2px solid #2a3a2a;
      border-radius: 4px;
      background: #141a14;
      color: #eee;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input.quiz-input:focus {
      outline: none;
      border-color: #5a9a5a;
    }
    input.quiz-input.correct {
      border-color: #4a8a4a;
      background: #1a2a1a;
    }
    input.quiz-input.incorrect {
      border-color: #e74c3c;
      background: #3a1a1a;
    }

    .score-bar {
      text-align: center;
      padding: 15px;
      font-size: 1.1rem;
      font-weight: 700;
      background: #1a211a;
      border-radius: 8px;
      margin: 10px auto;
      max-width: 900px;
    }
    .score-bar .score-num { color: #5a9a5a; }
    .score-bar .score-total { color: #8ab88a; }

    .section-label {
      font-size: 0.85rem;
      color: #888;
      padding: 5px 12px;
      background: #111;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      th, td { padding: 6px 8px; font-size: 0.85rem; }
      input.quiz-input { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>ATC Sector Frequency Quiz</h1>
  <p>Test your knowledge of sector IDs, names, and frequencies</p>
</header>

<div class="controls">
  <label for="sheet-select">Sheet:</label>
  <select id="sheet-select">
    <option value="all">All Sheets</option>
  </select>

  <label for="mode-select">Mode:</label>
  <select id="mode-select">
    <option value="freq">Blank Frequencies</option>
    <option value="random">Random Blank Column</option>
  </select>

  <button onclick="generateQuiz()">New Quiz</button>
  <button class="secondary" onclick="checkAnswers()">Check Answers</button>
  <button class="secondary" onclick="revealAnswers()">Reveal All</button>
</div>

<div class="score-bar" id="score-bar" style="display:none;">
  Score: <span class="score-num" id="score-correct">0</span> / <span class="score-total" id="score-total">0</span>
</div>

<div class="quiz-container" id="quiz-container"></div>

<script>

      }
    ]
  }
};

const columns = ["id", "name", "freq"];
const colLabels = { id: "Sector #", name: "Name", freq: "Frequency" };

let quizInputs = [];

function generateQuiz() {
  const sheetKey = document.getElementById("sheet-select").value;
  const mode = document.getElementById("mode-select").value;
  const container = document.getElementById("quiz-container");
  container.innerHTML = "";
  quizInputs = [];
  document.getElementById("score-bar").style.display = "none";

  const sheets = sheetKey === "all" ? Object.keys(DATA) : [sheetKey];

  sheets.forEach(key => {
    const sheet = DATA[key];

    // Sheet title
    const title = document.createElement("div");
    title.className = "sheet-title";
    title.textContent = key;
    container.appendChild(title);

    // Main row table
    const mainTable = buildTable([sheet.main], mode, true);
    container.appendChild(mainTable);

    // Sections
    sheet.sections.forEach(section => {
      if (section.label) {
        const lbl = document.createElement("div");
        lbl.className = "section-label";
        lbl.textContent = section.label;
        container.appendChild(lbl);
      }
      const tbl = buildTable(section.rows, mode, false);
      container.appendChild(tbl);
    });
  });
}

function buildTable(rows, mode, isMain) {
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");
  columns.forEach(col => {
    const th = document.createElement("th");
    th.textContent = colLabels[col];
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  rows.forEach(row => {
    const tr = document.createElement("tr");
    let blankCol;
    if (mode === "freq") {
      blankCol = "freq";
    } else {
      // Random column — pick from columns that have data
      const available = columns.filter(c => row[c] && row[c].toString().trim() !== "");
      blankCol = available[Math.floor(Math.random() * available.length)];
    }

    columns.forEach(col => {
      const td = document.createElement("td");
      if (col === blankCol) {
        const input = document.createElement("input");
        input.type = "text";
        input.className = "quiz-input";
        input.dataset.answer = row[col];
        input.placeholder = "?";
        input.addEventListener("keydown", e => {
          if (e.key === "Enter") {
            e.preventDefault();
            // Move to next input
            const idx = quizInputs.indexOf(input);
            if (idx >= 0 && idx < quizInputs.length - 1) {
              quizInputs[idx + 1].focus();
            } else {
              checkAnswers();
            }
          }
        });
        td.appendChild(input);
        quizInputs.push(input);
      } else {
        td.textContent = row[col];
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

function normalize(str) {
  return str.toString().trim().toLowerCase().replace(/\s+/g, " ");
}

function checkAnswers() {
  let correct = 0;
  let total = quizInputs.length;

  quizInputs.forEach(input => {
    const answer = normalize(input.dataset.answer);
    const userVal = normalize(input.value);
    input.classList.remove("correct", "incorrect");
    if (userVal === answer) {
      input.classList.add("correct");
      correct++;
    } else if (userVal !== "") {
      input.classList.add("incorrect");
    }
  });

  const bar = document.getElementById("score-bar");
  bar.style.display = "block";
  document.getElementById("score-correct").textContent = correct;
  document.getElementById("score-total").textContent = total;
}

function revealAnswers() {
  quizInputs.forEach(input => {
    input.value = input.dataset.answer;
    input.classList.remove("incorrect");
    input.classList.add("correct");
  });
  checkAnswers();
}

// Populate sheet selector
(function init() {
  const sel = document.getElementById("sheet-select");
  Object.keys(DATA).forEach(key => {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = key;
    sel.appendChild(opt);
  });
  generateQuiz();
})();
</script>

</html>
